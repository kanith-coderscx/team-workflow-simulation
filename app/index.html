<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>บันทึกรายรับ-รายจ่าย</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>บันทึกรายรับ-รายจ่าย</h1>
    <p class="tagline">Expense / income tracker — Process v2 simulation</p>
  </header>

  <main>
    <section id="add-section" aria-labelledby="add-heading">
      <h2 id="add-heading">เพิ่มรายการ</h2>

      <form id="add-form" novalidate>
        <div class="form-row">
          <label for="amount">จำนวนเงิน (บาท)</label>
          <input type="number" id="amount" name="amount" inputmode="decimal"
                 step="0.01" min="0" placeholder="0.00" aria-describedby="amount-error">
          <p class="field-error" id="amount-error" role="alert" aria-live="assertive"></p>
        </div>

        <div class="form-row">
          <span class="label-text" id="type-label">ประเภท</span>
          <div class="radio-group" role="radiogroup" aria-labelledby="type-label">
            <label><input type="radio" name="type" value="expense" checked> รายจ่าย</label>
            <label><input type="radio" name="type" value="income"> รายรับ</label>
          </div>
        </div>

        <div class="form-row">
          <label for="category">หมวดหมู่</label>
          <select id="category" name="category" aria-describedby="category-error">
            <option value="">— เลือกหมวดหมู่ —</option>
          </select>
          <p class="field-error" id="category-error" role="alert" aria-live="assertive"></p>
        </div>

        <div class="form-row">
          <label for="date">วันที่</label>
          <input type="date" id="date" name="date">
        </div>

        <div class="form-row">
          <label for="note">บันทึกช่วยจำ (ไม่บังคับ)</label>
          <input type="text" id="note" name="note" maxlength="200" placeholder="ไม่บังคับ">
        </div>

        <button type="submit" id="save-btn">บันทึกรายการ</button>
        <p class="form-success" id="form-success" role="status" aria-live="polite"></p>
      </form>

      <div class="added-list-wrap">
        <h3>รายการที่บันทึกไว้</h3>
        <ul id="added-list" aria-live="polite"></ul>
      </div>
    </section>

    <section id="history-section" aria-labelledby="history-heading">
      <h2 id="history-heading">รายการย้อนหลัง</h2>
      <ul id="history-list" aria-live="polite"></ul>
    </section>

    <section id="summary-section" aria-labelledby="summary-heading">
      <h2 id="summary-heading">สรุปยอดรายเดือน</h2>

      <div class="form-row summary-controls">
        <label for="summary-month">เลือกเดือน</label>
        <input type="month" id="summary-month" name="summary-month">
      </div>

      <div id="summary-body" class="summary-body" aria-live="polite"></div>
    </section>
  </main>

  <footer>
    <small>team-workflow-simulation · served from GitHub Pages</small>
  </footer>

  <script src="app.js"></script>
</body>
</html>
